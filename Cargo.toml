[package]
name = "shazam-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Shazam audio signatures, music recognition, and catalog access"

[dependencies]
base64 = "0.23"
crc32fast = "1.5"
hound = "3.5"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "gzip", "deflate", "socks"] }
rustfft = "6.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "process", "io-util", "rt-multi-thread", "macros", "time", "sync"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
axum = "0.8"
flate2 = "1"
tempfile = "3"
